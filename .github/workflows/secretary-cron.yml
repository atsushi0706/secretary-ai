name: Secretary briefing (morning + evening)

on:
  schedule:
    # GitHub Actions の cron は UTC。日本時間に換算：
    #   23:00 UTC (前日) = 翌日朝 8:00 JST → morning
    #   08:00 UTC        = 同日夕 17:00 JST → evening
    # ※GitHub Actions の cron は実行が 5〜15 分遅延することがある。
    - cron: '0 23 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning か evening を選ぶ（手動実行時のみ）'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mode=$INPUT_MODE" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "23" ]; then
              echo "mode=morning" >> $GITHUB_OUTPUT
            else
              echo "mode=evening" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Selected mode: $(cat $GITHUB_OUTPUT)"

      - name: Restore Google OAuth tokens
        env:
          TOKEN_MAIN_JSON: ${{ secrets.TOKEN_MAIN_JSON }}
          TOKEN_WORK_JSON: ${{ secrets.TOKEN_WORK_JSON }}
        run: |
          mkdir -p data
          printf '%s' "$TOKEN_MAIN_JSON" > data/token_main.json
          printf '%s' "$TOKEN_WORK_JSON" > data/token_work.json
          echo "Token files created:"
          ls -la data/

      - name: Send briefing via ntfy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_CLICK_URL: ${{ secrets.NTFY_CLICK_URL }}
          WORK_EMAIL: ${{ secrets.WORK_EMAIL }}
        run: python notify_ntfy.py ${{ steps.mode.outputs.mode }}
